name: Build TV Sync Agent APK
run-name: TV Sync Android TV build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tv-sync.yml'

permissions:
  contents: read

concurrency:
  group: tvsync-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm private-source token is configured
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.TVSYNC_PRIVATE_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Set TVSYNC_PRIVATE_SOURCE_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Private-source credential configured."

      - name: Check out private TV Sync source
        uses: actions/checkout@v4
        with:
          repository: SeanEmcee/TVSyncAgent
          ref: main
          token: ${{ secrets.TVSYNC_PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: source

      - name: Resolve private source project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/settings.gradle.kts ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"
          elif [ -f source/TVSyncAgent-native-milestone.zip ]; then
            mkdir -p project
            unzip -q source/TVSyncAgent-native-milestone.zip -d project
            test -f project/TVSyncAgent/settings.gradle.kts
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/TVSyncAgent" >> "$GITHUB_ENV"
          else
            echo "::error::Private repository has no Android source. Upload TVSyncAgent-native-milestone.zip or commit the unpacked project."
            exit 1
          fi

      - name: Apply private source fixes to archived milestone
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/TVSyncAgent-native-milestone.zip ]; then
            source_file="source/app/src/main/java/dev/tvsync/agent/EditorActivity.java"
            target_file="$PROJECT_DIR/app/src/main/java/dev/tvsync/agent/EditorActivity.java"
            test -f "$source_file"
            test -f "$target_file"
            cp "$source_file" "$target_file"
            if grep -q 'Files.readString' "$target_file"; then
              echo "::error::Android-incompatible Files.readString still present in text editor."
              exit 1
            fi
            echo "Applied private Android compatibility fix."
          fi

      - name: Apply private Android compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch_file in source/patches/*.patch; do
            echo "Applying private patch: $(basename "$patch_file")"
            patch -d "$PROJECT_DIR" -p1 --batch --forward < "$patch_file"
          done

      - name: Install private navigation source into archived Android project
        shell: bash
        run: |
          set -euo pipefail
          helper="source/app/src/main/java/dev/tvsync/agent/SidebarNavigation.java"
          test -f "$helper"
          mkdir -p "$PROJECT_DIR/app/src/main/java/dev/tvsync/agent"
          cp "$helper" "$PROJECT_DIR/app/src/main/java/dev/tvsync/agent/SidebarNavigation.java"
          grep -q 'SidebarNavigation.atLeftBoundary' "$PROJECT_DIR/app/src/main/java/dev/tvsync/agent/TvCanvas.java"

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API level 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify project and run source tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          python3 tools/test_menu_positioner.py
          python3 tools/test_browser_state.py
          mkdir -p "$RUNNER_TEMP/tvsync-nav-tests"
          javac -d "$RUNNER_TEMP/tvsync-nav-tests" \
            "$GITHUB_WORKSPACE/source/app/src/main/java/dev/tvsync/agent/SidebarNavigation.java" \
            "$GITHUB_WORKSPACE/source/tests/SidebarNavigationTest.java"
          java -cp "$RUNNER_TEMP/tvsync-nav-tests" SidebarNavigationTest

      - name: Compile and lint Android TV application
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVSyncAgent-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
